name: Build RiderX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto Fix File Locations
      run: |
        echo "Moving files to root directory..."
        cp -r .github/workflows/app ./ 2>/dev/null || true
        cp .github/workflows/build.gradle.kts ./ 2>/dev/null || true
        cp .github/workflows/settings.gradle.kts ./ 2>/dev/null || true
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        ls -la

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RiderX-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
