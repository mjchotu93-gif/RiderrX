name: Build RiderX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
name: Build RiderX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Create 100% Complete RiderX App Files
      run: |
        # 1. Setup SDK Path
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

        # 2. Settings file
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "RiderX"
        include(":app")
        EOF

        # 3. Root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        # 4. App build.gradle.kts
        mkdir -p app/src/main/java/com/riderx/app
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.riderx.app"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.riderx.app"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.8"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2024.02.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
        }
        EOF

        # 5. Manifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

            <application
                android:allowBackup="true"
                android:label="RiderX"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 6. MainActivity.kt (Full RiderX Dark UI & Mode Toggle)
        cat << 'EOF' > app/src/main/java/com/riderx/app/MainActivity.kt
        package com.riderx.app

        import android.os.Bundle
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.background
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.LazyColumn
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.platform.LocalContext
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp

        val DeepBlack = Color(0xFF0B0F0C)
        val DarkSurface = Color(0xFF141A16)
        val DarkSurfaceVariant = Color(0xFF1D2620)
        val NeonGreen = Color(0xFFB7F34A)
        val TextWhite = Color(0xFFF5F5F5)
        val TextGray = Color(0xFF9AA89E)

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    RiderXMainApp()
                }
            }
        }

        @Composable
        fun RiderXMainApp() {
            val context = LocalContext.current
            var isCycleMode by remember { mutableStateOf(false) }

            Scaffold(
                containerColor = DeepBlack
            ) { padding ->
                LazyColumn(
                    modifier = Modifier
                        .fillMaxSize()
                        .padding(padding)
                        .padding(16.dp)
                ) {
                    item {
                        Spacer(modifier = Modifier.height(16.dp))
                        Text(
                            text = "RiderX",
                            color = NeonGreen,
                            fontSize = 32.sp,
                            fontWeight = FontWeight.ExtraBold
                        )
                        Text(
                            text = "Ride Together. Explore More. Go Beyond.",
                            color = TextGray,
                            fontSize = 14.sp
                        )
                        Spacer(modifier = Modifier.height(20.dp))
                    }
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto Setup and Fix Resources
      run: |
        echo "Moving files to root directory..."
        cp -r .github/workflows/app ./ 2>/dev/null || true
        cp .github/workflows/build.gradle.kts ./ 2>/dev/null || true
        cp .github/workflows/settings.gradle.kts ./ 2>/dev/null || true
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

        # Fix invalid AndroidManifest icon reference
        if [ -f app/src/main/AndroidManifest.xml ]; then
          sed -i 's/android:icon="@android:drawable\/sym_def_app_icon"//g' app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@android:drawable\/sym_def_app_icon"//g' app/src/main/AndroidManifest.xml
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        JAVA_TOOL_OPTIONS: "-Xmx3072m"
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RiderX-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
